{% extends 'common/base.html' %}
{% load static %}

{% block content %}
<style>
    .auth-wrapper {
        font-family: Arial, sans-serif;
        background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)),
        url("{% static 'stylish-1.0.0/images/f21b837351a3b9ef5a829d17e5039bea.jpg' %}") no-repeat center center;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 60px 0;
    }

    .register-box {
        background: rgba(255, 255, 255, 0.95);
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 450px;
        box-sizing: border-box;
        margin: auto;
    }

    .register-box h2 {
        text-align: center;
        margin-bottom: 25px;
    }

    .input-group {
        margin-bottom: 10px;
        position: relative;
    }

    .input-group input,
    .input-group textarea {
        width: 100%;
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #ccc;
        box-sizing: border-box;
    }

    .eye {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        cursor: pointer;
    }

    .radio-group {
        margin-bottom: 10px;
    }

    .register-btn-submit {
        width: 100%;
        padding: 10px;
        background: green;
        color: white;
        border: none;
        border-radius: 5px;
    }
</style>

<div class="auth-wrapper">
    <div class="register-box">
        <h2>Register</h2>
        <form action="{% url 'form' %}" enctype="multipart/form-data" method="post">
            {% csrf_token %}

            <div class="input-group">
                <input type="file" name="profile" required>
            </div>
            <div class="input-group">
                <input type="text" name="first_name" placeholder="First Name" required>
            </div>
            <div class="input-group">
                <input type="text" name="last_name" placeholder="Last Name" required>
            </div>
            <div class="input-group">
                <textarea name="address" placeholder="Address"></textarea>
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="number" name="phone" placeholder="Phone" required>
            </div>
            <div class="radio-group">
                <label>Gender:</label><br>
                <input type="radio" name="gender" value="Male"> Male
                <input type="radio" name="gender" value="Female"> Female
            </div>
            <div class="input-group">
                <input type="text" name="city" placeholder="City" required>
            </div>
            <div class="input-group">
                <input type="text" name="state" placeholder="State" required>
            </div>
            <div class="input-group">
                <input type="number" name="postal_code" placeholder="Postal Code" required>
            </div>
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>
            <!-- PASSWORD -->
            <div class="input-group">
                <input type="password" id="reg-password" name="password" placeholder="Password" required>
                <span class="eye" onclick="toggleRegPassword()">👁️</span>
            </div>

            <button type="submit" class="register-btn-submit">Register</button>
        </form>
    </div>
</div>

<script>
    function toggleRegPassword() {
        var pass = document.getElementById("reg-password");
        if (pass.type === "password") {
            pass.type = "text";
        } else {
            pass.type = "password";
        }
    }
</script>
{% endblock %}
