<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Request</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .reset-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            width: 400px;
            text-align: center;
        }

        .reset-box h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .reset-box p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: darkgreen;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="reset-box">
        <h2>Reset Password</h2>
        <p>Type your registered email to receive a password reset link.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="input-group">
                <input type="email" name="email" placeholder="Email Address" required>
            </div>
            <button type="submit">Send Reset Link</button>
        </form>

        <a href="{% url 'home' %}" class="back-link">Back to Home</a>
    </div>

{% if messages %}
    {% for msg in messages %}
        <script>alert('{{msg}}')</script>
    {% endfor %}
{% endif %}

</body>
</html>
