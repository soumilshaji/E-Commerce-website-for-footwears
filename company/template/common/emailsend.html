<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sent</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .reset-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
            width: 400px;
            text-align: center;
        }

        .reset-box h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .reset-box p {
            color: #666;
            margin-bottom: 25px;
            font-size: 15px;
        }

        .btn-home {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            transition: background 0.3s;
            box-sizing: border-box;
        }

        .btn-home:hover {
            background: darkgreen;
        }
    </style>
</head>
<body>

    <div class="reset-box">
        <h2>Check Your Mail</h2>
        <p>A password reset link has been sent to your email address. Please check your inbox.</p>
        <a href="{% url 'home' %}" class="btn-home">Back to Home</a>
    </div>

</body>
</html>
