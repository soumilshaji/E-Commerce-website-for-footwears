<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Products</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .table-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }

        .table-container h2 {
            margin-bottom: 20px;
            color: #333;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            vertical-align: middle;
        }

        th {
            background-color: #f8f9fa;
            color: #333;
            text-transform: uppercase;
            font-size: 14px;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        .product-img {
            border-radius: 5px;
            object-fit: cover;
        }

        .action-link {
            display: inline-block;
            padding: 6px 12px;
            margin: 0 4px;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
        }

        .btn-edit {
            background-color: #007bff;
        }

        .btn-edit:hover {
            background-color: #0056b3;
        }

        .btn-delete {
            background-color: #dc3545;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .btn-back {
            display: inline-block;
            padding: 10px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 15px;
            transition: background 0.3s;
        }

        .btn-back:hover {
            background: #555;
        }
    </style>
</head>
<body>

    <div class="table-container">
        <h2>View Products</h2>

        <table>
            <thead>
                <tr>
                    <th>Photo</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Category</th>
                    <th style="text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for i in data %}
                <tr>
                    <td>
                        {% if i.image %}
                            <img src="{{ i.image.url }}" width="60" height="60" class="product-img">
                        {% else %}
                            <span style="color: #999; font-size: 12px;">No Image</span>
                        {% endif %}
                    </td>
                    <td>{{ i.name }}</td>
                    <td>{{ i.price }}</td>
                    <td>{{ i.stock }}</td>
                    <td>{{ i.category }}</td>
                    <td style="text-align: center;">
                        <a href="{% url 'edit_product' i.id %}" class="action-link btn-edit">Edit</a>
                        <a href="{% url 'delete_product' i.id %}" class="action-link btn-delete" onclick="return confirm('Are you sure you want to delete this product?')">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        
        <a href="{% url 'adminhome' %}" class="btn-back">&larr; Back to Admin Home</a>
    </div>

</body>
</html>
