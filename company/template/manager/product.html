<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .form-container h2 {
            margin-bottom: 25px;
            color: #333;
            text-transform: uppercase;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }

        .input-group input[type="text"],
        .input-group input[type="number"],
        .input-group input[type="file"],
        .input-group select,
        .input-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        .input-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: green;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: darkgreen;
        }

        .back-link {
            display: block;
            margin-top: 15px;
            color: #555;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Add Product</h2>
        <form action="{% url 'add_product' %}" enctype="multipart/form-data" method="post">
            {% csrf_token %}
            
            <div class="input-group">
                <label>Product Photo</label>
                <input type="file" name="image" required>
            </div>
            
            <div class="input-group">
                <label>Name</label>
                <input type="text" name="name" placeholder="Enter product name" required>
            </div>
            
            <div class="input-group">
                <label>Price</label>
                <input type="text" name="price" placeholder="Enter selling price" required>
            </div>
            
            <div class="input-group">
                <label>Stock</label>
                <input type="number" name="stock" placeholder="Enter available stock" required>
            </div>
            
            <div class="input-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="" disabled selected>Select Category</option>
                    {% for i in c %}
                    <option value="{{i.id}}">{{i.name}}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="input-group">
                <label>Description</label>
                <textarea name="description" placeholder="Product details..."></textarea>
            </div>
            
            <button type="submit">Add Product</button>
        </form>
        <a href="{% url 'adminhome' %}" class="back-link">&larr; Back to Admin Home</a>
    </div>

    {% if messages %}
        {% for msg in messages %}
        <script>alert('{{msg}}')</script>
        {% endfor %}
    {% endif %}

</body>
</html>
